services:
  # Backend API Server
  - type: web
    name: harmonytrack-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd backend-mock && npm install
    startCommand: cd backend-mock && npm start
    healthCheckPath: /api/health
    healthCheckInterval: 30
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false  # Set via dashboard
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REDIRECT_URI
        sync: false  # Update after frontend URL is known
      - key: ENCRYPTION_KEY
        sync: false
      - key: LOG_LEVEL
        value: info

  # Frontend React App
  - type: static
    name: harmonytrack-frontend
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    publishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://harmonytrack-backend.onrender.com
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000
